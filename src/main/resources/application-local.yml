# IDEA / Maven 本地开发配置：应用在宿主机运行，基础设施通过 Docker 暴露端口访问。
# DASHSCOPE_API_KEY 等密钥应放在 IDE 运行配置或环境变量中，不要提交到仓库。

server:
  port: ${LOCAL_SERVER_PORT:8081}

generation:
  mock:
    enabled: ${GENERATION_MOCK_ENABLED:true}

spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:${MYSQL_EXPOSED_PORT:3307}/${MYSQL_DATABASE:game_flow}?serverTimezone=GMT%2B8&useUnicode=true&characterEncoding=utf8
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:root}

  rabbitmq:
    host: 127.0.0.1
    port: ${RABBITMQ_AMQP_PORT:5673}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}

  data:
    redis:
      host: 127.0.0.1
      port: ${REDIS_EXPOSED_PORT:6380}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}

minio:
  endpoint: http://127.0.0.1:${MINIO_API_PORT:9100}
  client-endpoint: ${MINIO_LOCAL_ENDPOINT:http://127.0.0.1:${MINIO_API_PORT:9100}}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin}
  bucket-name: ${MINIO_BUCKET:aigc}

comfyui:
  enabled: ${COMFYUI_ENABLED:false}
  base-url: ${COMFYUI_LOCAL_BASE_URL:http://127.0.0.1:8000}
