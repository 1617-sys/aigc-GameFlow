server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/game_flow?serverTimezone=GMT%2B8
    username: root
    password: 161764

  neo4j:
    uri: bolt://localhost:7687
    authentication:
      username: neo4j
      password: "12345678"


  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    listener:
      simple:
        # 开启手动确认模式 (MANUAL)
        acknowledge-mode: manual
        # 每次只预取 1 条消息 (处理完一条再拿下一条，防止累死)
        prefetch: 1

# LangChain4j / DeepSeek 配置
langchain4j:
  open-ai:
    chat-model:
      api-key: ${DEEPSEEK_API_KEY}
      base-url: https://api.deepseek.com/v1 # DeepSeek API 地址
      model-name: deepseek-chat

# 自定义 ComfyUI 配置
comfyui:
  base-url: http://127.0.0.1:8000


mybatis-plus:
  # 告诉 MP：如果我写了 XML，请去 resources/mapper 目录下找
  mapper-locations: classpath:mapper/*.xml
  # 可选：打印 SQL 日志到控制台（开发阶段强烈建议加上，方便调试！）
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl


  data:
    redis:
      host: localhost
      port: 6379
      password: 123456
      database: 0
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8  # 最大连接数
          max-wait: -1ms # 最大等待时间

# 在 spring 同级或者最下面添加
minio:
  endpoint: http://localhost:9000  # API 端口 (不是控制台的9001)
  access-key: minioadmin
  secret-key: minioadmin
  bucket-name: aigc


